version: 2

models:

  - name: dim_cliente
    description: "Dimensão de clientes utilizada para análises."
    columns:
      - name: id_cliente
        description: "Identificador único do cliente."
        data_tests:
          - unique_columns
          - not_null_columns


  - name: dim_produto
    description: "Dimensão de produtos enriquecida com informações de categoria."
    columns:
      - name: id_produto
        description: "Identificador único do produto."
        data_tests:
          - unique_columns
          - not_null_columns


  - name: dim_tempo
    description: "Dimensão temporal utilizada para análises por data, mês, trimestre e ano."


  - name: fato_vendas
    description: "Tabela fato de vendas com granularidade por item de pedido."
    columns:

      - name: cliente_id
        description: "Identificador do cliente relacionado à venda."
        data_tests:
          - not_null_columns
          - relationship_columns:
              arguments:
                to_model: ref('dim_cliente')
                to_field: id_cliente

      - name: produto_id
        description: "Identificador do produto relacionado à venda."
        data_tests:
          - not_null_columns
          - relationship_columns:
              arguments:
                to_model: ref('dim_produto')
                to_field: id_produto


  - name: mart_cliente_360
    description: "Indicadores consolidados de clientes, incluindo quantidade de pedidos, total gasto e última compra."


  - name: mart_produto_desempenho
    description: "Indicadores consolidados de produtos, incluindo unidades vendidas e faturamento."